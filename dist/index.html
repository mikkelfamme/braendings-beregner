function finite(value, label='Tal') {
 if(value===null||value===undefined||typeof value==='boolean'||String(value).trim()==='') throw new Error(label+' mangler.');
 const n=typeof value==='number'?value:Number(String(value).replace(',','.'));
 if(!Number.isFinite(n)) throw new Error(label+' er ikke et gyldigt tal.');
 return n;
}
const formatter=new Intl.DateTimeFormat('sv-SE',{timeZone:ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function localParts(ms) {
 const p=Object.fromEntries(formatter.formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
 return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`};
}
function localToEpoch(date,time,occurrence='first') {
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time)) throw new Error('V\u00e6lg en gyldig dato og et klokkesl\u00e6t.');
 const wall=Date.parse(`${date}T${time}:00Z`);
 if(!Number.isFinite(wall)) throw new Error('Ugyldig dato.');
 // Danish civil time uses UTC+1 or UTC+2; try both rather than trusting phone timezone.
 const matches=[wall-7200000,wall-3600000].filter(ms=>{const p=localParts(ms);return p.date===date&&p.time===time;});
 if(!matches.length) throw new Error('Tidspunktet findes ikke i dansk tid. Ved sommertid springer uret fra 02 til 03.');
 return {ms:matches[occurrence==='second'?matches.length-1:0],ambiguous:matches.length>1};
}
function addDays(date,days) {
 const ms=Date.parse(date+'T12:00:00Z');
 if(!Number.isFinite(ms)) throw new Error('Ugyldig dato.');
 return new Date(ms+days*86400000).toISOString().slice(0,10);
}
function dayBounds(date) {return [localToEpoch(date,'00:00').ms,localToEpoch(addDays(date,1),'00:00').ms];}

/**
 * Cerama G20-20 factory programs, Danish manual v1.2 pp. 17-20.
 * SC 100 connected load: 7.0 kW.
 * P1-P7 use the manufacturer's approximate program time excluding natural cooling.
 * P8-P12 include controlled ramps/holds but contain a passive SkIP cooling phase whose duration is not stated.
 */
const seg=(rate,temp,hold=0)=>({rate,temp,hold});
const row=(id,name,temp,minutes,page,category,segments,note='')=>({id,name,temp,minutes,page,category,segments,note});
const FACTORY_PROGRAMS=[
 row(1,'Langsom forglødning',980,810,17,'Keramik',[seg(50,100),seg(75,980,5)]),
 row(2,'Normal forglødning',980,510,17,'Keramik',[seg(100,650),seg(150,980,5)]),
 row(3,'Lertøjsglasur',1020,390,17,'Keramik',[seg(100,100),seg(150,650),seg(200,1020,15)]),
 row(4,'Stentøjsglasur',1260,460,17,'Keramik',[seg(100,100),seg(150,650),seg(200,1260,15)],'Må aldrig benyttes til lertøj.'),
 row(5,'Porcelænsmaling',800,360,18,'Keramik',[seg(100,100),seg(150,650),seg(100,800)]),
 row(6,'Udtørring af gods',200,540,18,'Udtørring',[seg(30,70,60),seg(50,200,240)]),
 row(7,'Udtørring af ovnplader',300,165,18,'Udtørring',[seg(100,300)]),
 row(8,'Tack fusing',760,null,19,'Bullseye / System96',[seg(150,600),seg(250,760,5),seg(null,520,90),seg(30,400)],'Indeholder en naturlig SkIP-afkøling, som manualen ikke tidsangiver.'),
 row(9,'Full fusing',800,null,19,'Bullseye / System96',[seg(150,600),seg(250,800,5),seg(null,520,90),seg(30,400)],'Indeholder en naturlig SkIP-afkøling, som manualen ikke tidsangiver.'),
 row(10,'Slumping',720,null,19,'Bullseye / System96',[seg(150,600),seg(250,720,5),seg(null,520,90),seg(20,400)],'Indeholder en naturlig SkIP-afkøling, som manualen ikke tidsangiver.'),
 row(11,'Full fusing',820,null,20,'Floatglas',[seg(150,600),seg(250,820,5),seg(null,540,90),seg(30,400)],'Indeholder en naturlig SkIP-afkøling, som manualen ikke tidsangiver.'),
 row(12,'Slumping',740,null,20,'Floatglas',[seg(150,600),seg(250,740,5),seg(null,540,90),seg(30,400)],'Indeholder en naturlig SkIP-afkøling, som manualen ikke tidsangiver.')
];
const ALL_PROGRAMS=FACTORY_PROGRAMS;
const DEFAULT_SETTINGS={power:7,loadFactor:0.5,startTemperature:20};
function factoryProgram(id){const p=FACTORY_PROGRAMS.find(p=>p.id===Number(id));if(!p)throw Error('Ukendt fabriksprogram.');return p;}

const MINUTE=60000,HOUR=3600000;

function derivedActiveMinutes(program,startTemperature=20){
 let temp=startTemperature,minutes=0,passiveCooling=false;
 for(const s of program.segments){
  if(s.rate===null){passiveCooling=true;temp=s.temp;}
  else if(s.temp!==temp)minutes+=Math.abs(s.temp-temp)/s.rate*60;
  if(s.hold>0)minutes+=s.hold;
  temp=s.temp;
 }
 return {minutes,passiveCooling};
}

/**
 * Standard estimate used for every factory firing:
 * estimated kWh = kiln kW x active program hours x 0.50.
 * 0.50 is the fixed adjustment/load factor. Natural cooling after program end is 0 kWh.
 */
function buildProgram(id,settings=DEFAULT_SETTINGS){
 const f=factoryProgram(id);
 const power=finite(settings.power??7,'Effekt'),loadFactor=finite(settings.loadFactor??0.5,'Belastningsfaktor');
 if(Math.abs(power-7)>1e-9)throw Error('SC 100 beregnes med fast mærkeeffekt på 7,0 kW.');
 if(Math.abs(loadFactor-0.5)>1e-9)throw Error('Standardberegningen bruger fast belastningsfaktor 0,50.');

feed?.verified?'Prisfil modtaget':'Ikke tilsluttet')+'</dd><dt>Seneste hentning</dt><dd>'+h(S.feed?.fetchedAt?stamp(Date.parse(S.feed.fetchedAt)):'Ingen hentning')+'</dd><dt>Prisgrundlag</dt><dd>Samlet variabel pris fra <code>price.total</code> inkl. moms, tariffer og tillæg. Faste abonnementer er ikke fordelt.</dd><dt>Verificering</dt><dd>'+h(S.feed?.basisVerification?.method==='api-components-sum-to-price.total'?'Automatisk verificeret mod API-komponenterne':'Ikke verificeret')+'</dd><dt>Fremtidige priser</dt><dd>'+E.hourlyPrices(usablePriceArray(false),Date.now(),168).length+' komplette timer i prisfilen</dd></dl><button class="quiet" data-action="refresh" style="margin-top:16px">Hent seneste prisfil</button>'+source()+'</section></div></div>';}
function modal(){if(!S.modal)return '';return '<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="card-header"><h2>'+(S.modal==='save'?'Gem brænding':'Føj til hjemmeskærm')+'</h2><button class="icon-btn" data-action="close" aria-label="Luk">'+icon('close')+'</button></div>'+(S.modal==='save'?'<form id="save-form"><label for="save-note">Note</label><textarea id="save-note" maxlength="1000" placeholder="Fx glasur, indhold eller hvem der brænder"></textarea><button class="primary wide" style="margin-top:15px">Gem</button></form>':'<p>På iPhone: Åbn appens link i Safari, tryk Del, og vælg Føj til hjemmeskærm. På Android: vælg Installer app eller Føj til startskærm.</p>')+'</div></div>';}
function render(){const body=S.tab==='calc'?calcPage():S.tab==='cheap'?cheapPage():S.tab==='history'?historyPage():ovenPage();$('root').innerHTML='<div class="app">'+header()+priceBoard()+(S.error?'<p class="error" role="alert" style="margin-top:18px">'+h(S.error)+'</p>':'')+body+'<footer class="foot">Brænding 5.0.0 · Dansk tid (Europe/Copenhagen). Appen starter eller styrer aldrig ovnen.</footer></div>'+nav()+modal();}
function updateInputs(){if($('calc-date'))S.date=$('calc-date').value;if($('calc-time'))S.time=$('calc-time').value;if($('calc-program'))S.program=Number($('calc-program').value);if($('cheap-program'))S.cheapProgram=Number($('cheap-program').value);if($('occurrence'))S.occurrence=$('occurrence').value;}
async function loadPrices(){S.loading=true;S.fetchError='';try{const r=await fetch(new URL('data/prices.json',BASE),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('Prisfilen kunne ikke hentes.');const text=await r.text();if(text.length>8000000)throw Error('Prisfilen er for stor.');const f=JSON.parse(text);if(f.verified===true&&f.priceBasis!=='variable-total-dkk-kwh-including-vat')throw Error('Prisgrundlaget er ikke bekræftet.');S.prices=E.normalizePrices(f.prices||[]);S.feed=f;store('feed-v5',f);}catch(e){S.fetchError='Seneste prisfil kunne ikke hentes. '+e.message;const old=read('feed-v5',read('feed-v4',null));if(old?.priceBasis==='variable-total-dkk-kwh-including-vat'){S.feed=old;try{S.prices=E.normalizePrices(old.prices);}catch{S.prices=[];}}}finally{S.loading=false;}}
function usablePrices(){const p=usablePriceArray(true);if(!p.length)throw Error('Der er ingen gyldige prisintervaller.');return p;}
async function runCalculation(){updateInputs();S.error='';S.result=null;try{const p=E.buildProgram(S.program),start=E.localToEpoch(S.date,S.time,S.occurrence);S.busy=true;render();await new Promise(r=>setTimeout(r,15));S.result=E.calculate(start.ms,p,usablePrices());if(start.ambiguous)toast('Gentaget klokkeslæt: '+(S.occurrence==='second'?'anden':'første')+' forekomst.');}catch(e){S.error=e.message;}finally{S.busy=false;render();if(S.result&&innerWidth<721)document.querySelector('.result-column')?.scrollIntoView({behavior:'smooth',block:'start'});}}
async function runCheapest(){updateInputs();S.error='';S.optimal=null;try{const p=E.buildProgram(S.cheapProgram);S.busy=true;render();await new Promise(r=>setTimeout(r,20));S.optimal=E.findCheapest(p,usablePrices(),Date.now());}catch(e){S.error=e.message;}finally{S.busy=false;render();}}
async function share(text,url){try{if(navigator.share)await navigator.share({title:'Brænding',text,...(url?{url}:{})});else if(navigator.clipboard){await navigator.clipboard.writeText(text+(url?'\n'+url:''));toast('Kopieret til udklipsholder.');}else prompt('Kopiér teksten:',text+(url?'\n'+url:''));}catch(e){if(e.name!=='AbortError')toast('Delingen kunne ikke gennemføres.');}}
function resultText(r){return 'Keramik ovnen · P'+r.programId+' '+r.programName+'\nStart '+stamp(r.start)+'\nPris '+money(r.cost)+'\nEstimeret forbrug '+num(r.kwh,1)+' kWh\nStandardmodel: 7,0 kW × programtid × 0,50'+(r.forecast?'\nIndeholder prognosepriser.':'')+'\n'+r.coolingText+'\nData provided by Strømligning. https://stromligning.dk';}
$('root').addEventListener('submit',async ev=>{ev.preventDefault();S.error='';try{if(ev.target.id==='calc-form')return await runCalculation();if(ev.target.id==='cheap-form')return await runCheapest();if(ev.target.id==='save-form'){if(!S.result?.complete)throw Error('Beregn en fuld pris først.');const record={...S.result,id:crypto.randomUUID(),note:$('save-note').value.trim(),savedAt:new Date().toISOString()};delete record.breakdown;const history=[record,...S.history].slice(0,100);if(store('history-v5',history))S.history=history;S.modal=null;S.tab='history';render();toast('Brændingen er gemt.');}}catch(e){S.error=e.message;render();}});
$('root').addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;try{updateInputs();S.error='';if(b.dataset.tab){S.tab=b.dataset.tab;render();window.scrollTo(0,0);return;}if(b.dataset.candidate){const r=S.optimal?.[b.dataset.candidate];if(!r)return;const local=E.localParts(r.start);S.program=r.programId;S.date=local.date;S.time=local.time;S.result=E.calculate(r.start,E.buildProgram(r.programId),usablePrices());S.tab='calc';render();window.scrollTo(0,0);return;}if(b.dataset.delete){if(confirm('Slet brændingen fra denne browser?')){const rows=S.history.filter(r=>r.id!==b.dataset.delete);if(store('history-v5',rows))S.history=rows;render();}return;}if(b.dataset.share){const r=S.history.find(r=>r.id===b.dataset.share);if(r)await share(resultText(r));return;}const a=b.dataset.action;if(a==='refresh'){S.result=null;S.optimal=null;await loadPrices();render();toast(S.fetchError||'Seneste prisfil er hentet.');}if(a==='share-app')await share('Brænding - Keramik ovnen',BASE.href);if(a==='install'){S.modal='install';render();}if(a==='close'){S.modal=null;render();}if(a==='save'){S.modal='save';render();$('save-note')?.focus();}if(a==='share-result'&&S.result?.complete)await share(resultText(S.result));}catch(e){S.error=e.message;render();}});
$('root').addEventListener('change',ev=>{updateInputs();if(ev.target.id==='calc-program'){S.result=null;render();}if(ev.target.id==='cheap-program'){S.optimal=null;render();}if(['calc-date','calc-time','occurrence'].includes(ev.target.id)){S.result=null;render();}});
$('root').addEventListener('input',ev=>{if(['calc-date','calc-time'].includes(ev.target.id)){updateInputs();S.result=null;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}});
render();loadPrices().then(render);
})();
</script></body></html>

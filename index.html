function modeField(){return '<div class="field full"><label for="price-mode">Prisgrundlag</label><select id="price-mode"><option value="demo"'+sel(S.mode,'demo')+'>Eksempeldata · prøv appen</option><option value="manual"'+sel(S.mode,'manual')+'>Min egen faste elpris</option><option value="live"'+sel(S.mode,'live')+'>Strømligning - kræver prisopsætning</option></select></div>'+(S.mode==='manual'?'<div class="field full"><label for="manual-price">Samlet variabel elpris, kr./kWh</label><input id="manual-price" inputmode="decimal" value="'+h(S.manualPrice)+'" placeholder="Fx 2,00"><small>Inklusive moms, tariffer og tillæg. Ingen faste abonnementer.</small></div>':'');}
function header(){return '<header><div class="brand"><div class="brandmark">'+icon('flame')+'</div><div><strong>Brænding</strong><small>'+h(S.config.name)+' · keramik & elpriser</small></div></div><div class="header-actions"><span class="pill">'+'GitHub-udgave'+'</span><button class="icon-btn" data-action="share-app" aria-label="Del appen">'+icon('share')+'</button><button class="icon-btn" data-action="install" aria-label="Installer på telefonen">'+icon('settings')+'</button></div></header>';}
function nav(){return '<nav class="tabbar" aria-label="Hovedmenu">'+[['calc','Beregn','calc'],['prices','Elpriser','price'],['history','Brændinger','history'],['settings','Indstillinger','settings']].map(([id,name,ico])=>'<button class="tab'+(S.tab===id?' active':'')+'" data-tab="'+id+'"'+(S.tab===id?' aria-current="page"':'')+'>'+icon(ico)+h(name)+'</button>').join('')+'</nav>';}
function introduction(title,desc){return '<section class="intro"><p class="eyebrow">'+h(S.config.name)+' / '+h(S.tab==='calc'?'Planlæg en brænding':S.tab==='prices'?'Dit prisoverblik':S.tab==='history'?'Din lokale ovnbog':'Gør appen til jeres')+'</p><h1>'+title+'</h1><p class="muted">'+desc+'</p></section>';}
function priceChart(prices,active=null){if(!prices.length)return '<p class="muted small">Ingen prisdata hentet endnu.</p>';let bounds;try{bounds=E.dayBounds(S.date);}catch{return 'V&#230;lg en gyldig dato.';}const [a,z]=bounds,p=prices.filter(x=>x.start>=a&&x.start<z);if(!p.length)return '<p class="muted small">Der er ingen offentliggjorte priser for den valgte dato.</p>';const lo=Math.min(0,...p.map(x=>x.price)),hi=Math.max(.01,...p.map(x=>x.price)),range=hi-lo;return '<div class="chart" role="img" aria-label="Elpris pr. tidsinterval. Detaljer findes i pristabellen.">'+p.map(x=>{const b=x.price>=0?(-lo/range*100):((x.price-lo)/range*100),height=Math.max(.5,Math.abs(x.price)/range*100);return '<div class="bar-slot" title="'+h(E.localParts(x.start).time+' · '+num(x.price)+' kr./kWh')+'"><div class="bar'+(active&&x.start<active.end&&x.end>active.start?' active':'')+'" style="bottom:'+b+'%;height:'+height+'%"></div></div>';}).join('')+'</div><div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div><div class="legend"><span><i class="dot"></i>Elpris</span>'+(active?'<span><i class="dot clay"></i>Din brænding</span>':'')+'<span>'+h(num(lo))+' til '+h(num(hi))+' kr./kWh</span></div>';}
function calcPage(){const p=S.config.programs.find(x=>x.id===S.program);return introduction('Hvad koster<br>næste brænding?','Vælg program og starttid. Beregn prisen for hele forløbet, eller sammenlign andre starttidspunkter.')+'<div class="grid calc-grid"><div class="stack"><section class="card input-card"><div class="row"><h2>Din brænding</h2><span class="pill">Cerama SC 100</span></div><div class="programs">'+S.config.programs.map(p=>'<button class="program'+(S.program===p.id?' active':'')+'" data-program="'+p.id+'" aria-pressed="'+(S.program===p.id)+'"><b>PROGRAM '+p.id+'</b><span>'+h(p.name)+'</span><small>'+p.temp+' °C · '+h(duration(p.minutes))+'</small></button>').join('')+'</div><form id="calc-form"><div class="form-grid">'+field('calc-date','Dato','date',S.date,'required')+field('calc-time','Starttid','time',S.time,'required')+field('calc-kwh','Forbrug, kWh','text',S.kwh,'inputmode="decimal" placeholder="Indtast dit estimat"'+(S.profile.length?' disabled':''))+field('calc-minutes','Varighed, minutter','number',S.minutes,'min="1" max="2880" step="1"'+(S.profile.length?' disabled':''))+'<details class="field full" style="margin:0;padding-top:10px"><summary>Urskift mellem sommer- og vintertid</summary><label for="occurrence">Ved gentaget klokkeslæt i oktober</label><select id="occurrence"><option value="first"'+sel(S.occurrence,'first')+'>Første forekomst (normalt)</option><option value="second"'+sel(S.occurrence,'second')+'>Anden forekomst (efter urskift)</option></select></details>'+modeField()+'</div><p class="note">'+(S.profile.length?'Der bruges '+S.profile.length+' gemte forbrugsintervaller. Rediger dem under Indstillinger.':'Uden en tidsopdelt måling fordeles dine kWh jævnt gennem brændingen. Prisen er derfor et estimat.')+'</p>'+(p.id===4?'<p class="warn">Program 4 er til stentøjsglasur. Må ikke bruges til lertøj.</p>':'')+'<button class="primary wide" style="margin-top:20px" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'<i class="spinner"></i> Beregner...':'Beregn brænding')+'</button></form><p class="small muted" style="margin-top:12px">Dansk tid · sluttid er uden afkøling.</p></section><section class="card optimize-card"><div class="card-header"><h2>En billigere start?</h2><span class="pill">Hele programmet</span></div><p class="muted small" style="margin-bottom:17px">Sammenlign starter på den valgte dato inden for dit tidsvindue.</p><div class="form-grid">'+field('opt-from','Tidligst','time',S.from)+field('opt-to','Senest','time',S.to)+'</div><button class="quiet wide" style="margin-top:17px" data-action="optimize"'+(S.busy?' disabled':'')+'>Find billigste start</button>'+optimizationHtml()+'</section></div><div class="stack">'+resultHtml()+'<section class="card prices-card"><div class="card-header"><h2>Priser gennem dagen</h2><span class="eyebrow">kr./kWh</span></div>'+priceChart(S.prices,S.result)+sourceFooter()+'</section><p class="foot">Programtiderne tager udgangspunkt i G20-20-manualen, side 17. Kontroller, at de svarer til din automatik. Appen starter eller styrer ikke ovnen.</p></div></div>';}
function resultHtml(){const r=S.result;if(!r)return '<section class="card empty-result"><span class="eyebrow">Dit prisestimat</span><h2>Et overblik,<br>før du tænder.</h2><p class="muted small">Angiv dit forventede forbrug og tryk Beregn. Her vises prisen på hele brændingen.</p></section>';if(!r.complete)return '<section class="card incomplete-result"><span class="eyebrow">Prisgrundlaget er ikke komplet</span><h2 style="margin:15px 0">Der mangler priser.</h2><p class="muted">'+h(num(r.missingMinutes,0))+' minutter af brændingen mangler prisdata. Derfor vises ingen samlet pris.</p><p class="note">Vælg et tidligere tidspunkt, brug en manuel pris, eller vent på, at priserne bliver offentliggjort. Der indsættes ikke en skjult prognose.</p></section>';return '<section class="card result"><div class="row"><span class="eyebrow">'+(r.mode==='demo'?'Eksempel · ikke en virkelig pris':'Estimeret brændingspris')+'</span><span class="pill" style="background:#ffffff18;color:white">P'+r.programId+'</span></div><div class="amount">'+num(r.cost)+'<span>kr.</span></div><div class="metrics"><div><strong>'+num(r.kwh,1)+' kWh</strong><small>Forbrug i beregningen</small></div><div><strong>'+num(r.cost/r.kwh)+' kr.</strong><small>Forbrugsvægtet pris pr. kWh</small></div></div><div class="metrics" style="margin-top:18px"><div><strong style="font-size:16px">'+h(stamp(r.start))+'</strong><small>Start</small></div><div><strong style="font-size:16px">'+h(stamp(r.end))+'</strong><small>Varmeprogram slut · ikke klar til åbning</small></div></div><p class="note">'+(r.uniform?'Jævnt fordelt forbrug. Tidsfordelingen er ikke målt.':'Beregnet ud fra dine angivne forbrugsintervaller.')+' '+(r.mode==='manual'?'Din indtastede pris bruges i hele perioden.':r.mode==='demo'?'Priser og eksempel-kWh er kunstige.':'Den valgte elaftale bruges. Faste abonnementer er ikke medregnet.')+'</p><div class="btn-row"><button class="quiet" data-action="save-open">Gem brænding</button><button class="quiet" data-action="share-result">Del resultat</button></div></section>';}
function optimizationHtml(){const o=S.optimal;if(!o)return '';if(!o.candidates.length)return '<p class="warn">Ingen komplette prisforløb i tidsvinduet. Der bruges ikke prognoser til at anbefale en start.</p>';return '<p class="small muted" style="margin-top:18px">'+(S.mode==='demo'?'Eksempeldata · ':'')+'Bedste starter blandt '+o.candidates.length+' beregninger i trin på 15 minutter.</p>'+o.candidates.slice(0,3).map((r,i)=>'<button class="choice'+(i===0?' best':'')+'" data-candidate="'+i+'"><span><b>Start '+h(E.localParts(r.start).time)+'</b><small>Varmeprogram slut '+h(stamp(r.end))+'</small></span><strong>'+h(money(r.cost))+'</strong></button>').join('')+(o.skipped?'<p class="small muted" style="margin-top:12px">'+o.skipped+' starter mangler priser og er udeladt.</p>':'');}
function pricesPage(){const [a,z]=E.dayBounds(S.date),rows=S.prices.filter(p=>p.start>=a&&p.start<z),now=rows.find(p=>p.start<=Date.now()&&p.end>Date.now());return introduction('Strøm, time for time.','Priserne vises i de tilgængelige intervaller. Manglende priser udfyldes ikke med gæt.')+'<div class="grid"><section class="card"><div class="form-grid">'+field('price-date','Dato','date',S.date)+modeField()+'</div><button class="primary wide" data-action="load-prices" style="margin-top:18px"'+(S.busy?' disabled':'')+'>'+(S.busy?'Henter...':'Vis priser')+'</button><p class="note">Alle tider er i Europe/Copenhagen. API-nøglen indsættes kun på serveren.</p></section><section class="card"><div class="card-header"><h2>Dagens priser</h2><span class="pill">'+(S.mode==='demo'?'Eksempel':S.mode==='manual'?'Din indtastning':'Strømligning')+'</span></div>'+(now?'<div class="metrics" style="border:0;padding:0"><div><strong>'+num(now.price)+' kr.</strong><small>Prisen lige nu pr. kWh'+(S.mode==='demo'?' · kunstig':'')+'</small></div><div><strong>'+num(Math.min(...rows.map(p=>p.price)))+' kr.</strong><small>Laveste kendte intervalpris</small></div></div>':'')+priceChart(S.prices)+sourceFooter()+'<details><summary>Se alle prisintervaller</summary><div class="table-wrap"><table><thead><tr><th>Start, dansk tid</th><th>kr./kWh</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+h(E.localParts(p.start).time)+' <span class="muted">(UTC'+((Date.parse(E.localParts(p.start).date+'T'+E.localParts(p.start).time+':00Z')-p.start)/3600000)+')</span></td><td>'+num(p.price,4)+'</td></tr>').join('')+'</tbody></table></div></details></section></div>';}
function historyPage(){return introduction('Din lokale ovnbog.','Historikken gemmes kun i denne browser. Den deles ikke automatisk mellem telefonerne.')+'<div class="row" style="margin-bottom:20px"><span class="muted small">'+(preview?'Gemmes kun i denne browser. Ingen familiesynkronisering.':'Fælles historik. Visningen omfatter de seneste 40 gemte beregninger.')+'</span><button class="quiet" data-action="refresh-history">Opdater</button></div>'+(S.history.length?S.history.map(r=>'<article class="history-item"><div class="row"><span class="pill">'+h(r.type)+' · P'+r.programId+'</span><strong>'+h(money(r.cost))+'</strong></div><h3>'+h(r.programName)+'</h3><p class="small muted">'+h(stamp(r.start))+' · '+num(r.kwh,1)+' kWh'+(r.by?' · '+h(r.by):'')+'</p><p class="small muted">'+(r.mode==='demo'?'EKSEMPELDATA':r.mode==='manual'?'Manuel elpris':'Strømligning')+' · '+(r.uniform?'Jævnt fordelt forbrug':'Tidsopdelt forbrugsprofil')+'</p>'+(r.note?'<p class="small" style="margin-top:10px">'+h(r.note)+'</p>':'')+'<div class="actions"><button class="quiet" data-history-share="'+h(r.id)+'">Del beregning</button><button class="quiet" data-delete="'+h(r.id)+'">Slet</button></div></article>').join(''):'<section class="card empty"><span class="eyebrow">En frisk start</span><h2>Ingen brændinger endnu.</h2><p class="muted">Lav en beregning og tryk Gem brænding.</p></section>')+'<button class="quiet" data-action="export" style="margin-top:16px">Eksporter indstillinger og de viste brændinger</button>';}
function settingsPage(){const p=S.config.programs.find(x=>x.id===S.editProgram);return introduction('Din ovn. Dine tal.','Programændringer og historik gemmes på denne enhed. Alle telefoner kan bruge samme offentlige prisfil.')+`<div class="grid"><div class="stack"><section class="card"><h2>Ovn</h2><form id="oven-form" style="margin-top:18px"><div class="form-grid">${field('oven-name','Navn','text',S.config.name)}${field('oven-power','Maksimal effekt, kW','text',S.config.power,'inputmode="decimal"')}</div><button class="primary" style="margin-top:18px">Gem ovn</button></form></section><section class="card"><h2>Programprofiler</h2><label for="edit-program">Program</label><select id="edit-program">${S.config.programs.map(x=>`<option value="${x.id}"${sel(x.id,S.editProgram)}>P${x.id} - ${h(x.name)}</option>`).join('')}</select><form id="program-form" style="margin-top:18px"><div class="form-grid">${field('program-minutes','Varighed, minutter','number',p.minutes,'min="1" max="2880"')}${field('program-kwh','Forbrug, kWh','text',p.kwh??'','inputmode="decimal" placeholder="Ikke kendt endnu"')}<div class="field full"><label for="program-basis">Forbrugsgrundlag</label><select id="program-basis">${[['estimate','Mit skøn'],['measured-total','Særskilt målt total'],['household','Udledt af husstandens forbrug'],['measured-profile','Særskilt målt tidsprofil']].map(([v,n])=>`<option value="${v}"${sel(v,p.basis)}>${n}</option>`).join('')}</select></div></div><details><summary>Avanceret: tidsopdelt forbrug</summary><p>Et interval pr. linje: minutter;kWh. Format-eksempel: 60;3,2. Brug egne tal. En profil erstatter varighed og kWh ovenfor.</p><label for="program-profile">Forbrugsprofil</label><textarea id="program-profile">${h((p.profile||[]).map(x=>x.minutes+';'+x.kwh).join('\n'))}</textarea></details><button class="primary" style="margin-top:18px">Gem programprofil</button></form><p class="note">Der er ingen fabriksoplyste kWh-tal i appen. Temperaturkurven er ikke en måling af strømforbruget. Sluttider er uden afkøling.</p></section></div><div class="stack"><section class="card"><h2>Fælles elpriser</h2><p style="margin-top:16px">Strømligning skal tilsluttes i GitHub Actions. API-nøglen skal gemmes som en Secret i GitHub, aldrig i denne app eller en offentlig fil.</p><p class="note">Indtil prisopsætningen er verificeret, bruges Min egen faste elpris. Det er ikke live-data. Senere læser alle telefoner den samme prisfil fra GitHub.</p></section><section class="card"><h2>Del appen</h2><p style="margin:16px 0">Appen er offentlig og har ikke login. Send linket til familien. Private noter og personlige programændringer gemmes kun i den aktuelle browser.</p><button class="quiet wide" data-action="share-app">Del appens link</button><button class="inline-link" data-action="install">Føj til hjemmeskærm</button></section><section class="card"><h2>Din lokale kopi</h2><p style="margin:16px 0">Gem en eksport, inden du rydder browserdata. Kopien indeholder dine indstillinger og op til 40 gemte beregninger. Den skal holdes privat. Automatisk import og synkronisering er ikke med i denne udgave.</p><button class="quiet wide" data-action="export">Eksporter kopi</button></section><p class="foot">Brænding 2.0 - GitHub-udgave. Ingen Vercel, ingen database og ingen ovnstyring.</p></div></div>`;}
function loginPage(){return '';}
function modalHtml(){if(!S.modal)return '';let title='',body='';if(S.modal==='install'){title='Appen på telefonen';body='<p>Åbn GitHub Pages-linket i Safari. Vælg <b>Del > Føj til hjemmeskærm</b>. Vælg Åbn som webapp, hvis det vises.</p><p>På Android kan Chrome vise Installer app eller Føj til startskærm.</p><p class="note">Der er intet login. Noter og historik bliver på den enkelte enhed. Safari og en installeret webapp kan have separat lokal lagring.</p>';}if(S.modal==='save'){title='Gem brænding';body='<form id="save-form"><div class="form-grid">'+field('save-by','Hvem brænder?','text','','maxlength="40"')+'<div class="field"><label for="save-type">Status</label><select id="save-type"><option>Planlagt</option><option>Gennemført</option></select></div><div class="field full"><label for="save-note">Note - kun på denne enhed</label><textarea id="save-note" maxlength="400"></textarea></div></div><p class="note">'+(S.result?.mode==='demo'?'EKSEMPELDATA. ':'')+'Beløbet er et beregnet estimat, ikke en målt elregning.</p><button class="primary wide" style="margin-top:18px">Gem i min ovnbog</button></form>';}return '<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="card-header"><h2 id="modal-title">'+title+'</h2><button class="icon-btn" data-action="close-modal" aria-label="Luk">'+icon('close')+'</button></div>'+body+'</section></div>';}
function render(){const error=S.error?'<p class="error" role="alert">'+h(S.error)+'</p>':'';byId('root').innerHTML='<div class="app">'+header()+(S.logged&&S.mode==='demo'?'<aside class="banner"><b>Eksempeldata.</b> Priserne er kunstige. De 30 kWh i eksemplet er ikke en måling af din ovn. Skift til din egen pris og dit eget forbrug for en personlig beregning.</aside>':'')+(preview&&S.mode!=='demo'?'<aside class="banner"><b>Lokal historik.</b> Historik og indstillinger bliver kun gemt i denne browser.</aside>':'')+'<main style="padding-top:16px">'+error+(S.logged?({calc:calcPage,prices:pricesPage,history:historyPage,settings:settingsPage}[S.tab])():loginPage())+'</main></div>'+(S.logged?nav():'')+modalHtml();}
function readCalc(){for(const [id,key]of [['calc-date','date'],['calc-time','time'],['calc-kwh','kwh'],['calc-minutes','minutes'],['occurrence','occurrence'],['manual-price','manualPrice'],['opt-from','from'],['opt-to','to'],['price-date','date']]){const e=byId(id);if(e)S[key]=e.value;}}
function setProgram(id){const p=S.config.programs.find(x=>x.id===id);S.program=id;S.minutes=p.minutes;S.kwh=p.kwh??(S.mode==='demo'?'30':'');S.profile=clone(p.profile||[]);S.result=null;S.optimal=null;S.error='';}
function programInput(){return {minutes:S.minutes,kwh:S.kwh,profile:S.profile};}
function decorate(r){const p=S.config.programs.find(x=>x.id===S.program);return {...r,programId:p.id,programName:p.name,basis:p.basis||'estimate',mode:S.mode,electricity:clone(S.config.electricity)};}
async function pricesFor(){if(S.mode==='demo')return E.demoPrices(S.date,3);if(S.mode==='manual'){const price=E.finite(S.manualPrice,'Elprisen');const start=E.dayBounds(S.date)[0],end=E.dayBounds(E.addDays(S.date,3))[0];return [{start,end,price}];}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(new URL('data/prices.json',APP_BASE),{cache:'no-store',credentials:'omit',signal:controller.signal});if(!r.ok)throw Error('Prisfilen kunne ikke hentes.');const d=await r.json();if(d.verified!==true||d.priceBasis!=='variable-total-dkk-kwh-including-vat'||!d.fetchedAt||!Array.isArray(d.prices))throw Error('Automatiske priser er ikke tilsluttet endnu. Brug Min egen faste elpris.');S.fetchedAt=d.fetchedAt;S.priceWarning=Date.now()-Date.parse(d.fetchedAt)>36*3600000?'Prisfilen er over 36 timer gammel. Kontroller dækning og Actions.':'';if(S.priceWarning)toast(S.priceWarning);return E.normalizePrices(d.prices).filter(x=>!x.forecast);}finally{clearTimeout(timer);}}
async function runCalculation(){readCalc();S.error='';S.result=null;S.optimal=null;try{const start=E.localToEpoch(S.date,S.time,S.occurrence);E.validateProfile(programInput(),S.config.power);S.busy=true;render();S.prices=await pricesFor();S.result=decorate(E.calculate(start.ms,programInput(),S.prices,S.config.power));if(start.ambiguous)toast('Gentaget klokkeslæt: '+(S.occurrence==='second'?'anden':'første')+' forekomst er valgt.');}catch(e){S.error=e.message;}finally{S.busy=false;render();if(S.result&&innerWidth<721)document.querySelector('.result')?.scrollIntoView({behavior:'smooth',block:'center'});}}
async function runOptimization(){readCalc();S.error='';S.result=null;S.optimal=null;try{E.validateProfile(programInput(),S.config.power);const first=E.localToEpoch(S.date,S.from,S.occurrence).ms,last=E.localToEpoch(S.date,S.to,S.occurrence).ms;S.busy=true;render();S.prices=await pricesFor();S.optimal=E.optimize(first,last,programInput(),S.prices,S.config.power);S.optimal.candidates=S.optimal.candidates.map(decorate);}catch(e){S.error=e.message;}finally{S.busy=false;render();}}
async function refreshHistory(){if(preview)S.history=loadLocal('history',[]);else S.history=(await api('/history')).items;}
async function saveConfig(config){if(preview)storeLocal('config',config);else await api('/config','PUT',config);S.config=config;S.result=null;S.optimal=null;toast(preview?'Gemt i denne browser.':'Gemt for familien. Andre telefoner ser ændringen efter genindlæsning; der kan gå et minut.');}
function parseProfile(text){if(!text.trim())return [];return text.trim().split(/\r?\n/).filter(x=>x.trim()).map((line,i)=>{const parts=line.split(';');if(parts.length!==2)throw new Error('Profilens linje '+(i+1)+' skal have formatet minutter;kWh.');return {minutes:E.finite(parts[0],'Minutter'),kwh:E.finite(parts[1],'kWh')};});}
async function shareText(text,url){try{if(navigator.share){await navigator.share({title:'Brænding',text,...(url?{url}:{})});return;}const value=text+(url?'\n'+url:'');if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(value);toast('Kopieret. Indsæt i en besked.');}else prompt('Kopier teksten til en besked:',value);}catch(e){if(e.name!=='AbortError')toast('Deling blev ikke gennemført.');}}
function resultText(r){return (r.mode==='demo'?'EKSEMPEL · IKKE FAKTISKE PRISER\n':'')+'Brænding · P'+r.programId+' '+r.programName+'\nStart: '+stamp(r.start)+'\nVarmeprogram slut: '+stamp(r.end)+' (uden afkøling)\nForbrug: '+num(r.kwh,2)+' kWh\nBeregnet pris: '+money(r.cost)+'\n'+(r.uniform?'Forbruget er fordelt jævnt.':'Bruger angivet tidsopdelt forbrugsprofil.')+'\n'+(r.mode==='live'?'Data provided by Strømligning. Elaftale: '+(r.electricity?.label||'Valgt produkt'):r.mode==='manual'?'Bruger manuelt indtastet elpris.':'Kunstige eksempelpriser.')+'\nPrisestimat, ikke en målt faktura.';}
function exportData(){const data={app:'Braending',version:1,exportedAt:new Date().toISOString(),scope:'Indstillinger og seneste 40 viste beregninger; ikke fuld historik',config:S.config,history:S.history};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='braending-kopi-'+E.localParts(Date.now()).date+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function action(name){readCalc();S.error='';try{if(name==='optimize')return await runOptimization();if(name==='load-prices'){S.busy=true;render();S.prices=await pricesFor();S.busy=false;render();}if(name==='share-app'){if(location.protocol==='file:'){toast('Del GitHub Pages-adressen, ikke den lokale fil.');return;}await shareText('Brænding - keramik og elpriser. Ingen konto nødvendig.',APP_BASE.href);}if(name==='install'){S.modal='install';render();}if(name==='close-modal'){S.modal=null;render();}if(name==='save-open'){if(!S.result?.complete)throw new Error('Lav en komplet beregning først.');S.modal='save';render();byId('save-by')?.focus();}if(name==='share-result'&&S.result?.complete)await shareText(resultText(S.result));if(name==='refresh-history'){await refreshHistory();render();toast('Den lokale historik er opdateret.');}if(name==='export')exportData();}catch(e){S.busy=false;S.error=e.message;render();}}
byId('root').addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.tab){readCalc();S.tab=b.dataset.tab;S.error='';S.modal=null;if(S.tab==='history')await refreshHistory();render();window.scrollTo(0,0);return;}if(b.dataset.program){readCalc();setProgram(Number(b.dataset.program));render();return;}if(b.dataset.candidate!==undefined){const r=S.optimal.candidates[Number(b.dataset.candidate)];S.time=E.localParts(r.start).time;S.occurrence=E.localToEpoch(S.date,S.time).ms===r.start?'first':'second';S.result=r;render();if(innerWidth<721)document.querySelector('.result')?.scrollIntoView({behavior:'smooth'});return;}if(b.dataset.action){ev.preventDefault();await action(b.dataset.action);return;}if(b.dataset.historyShare){const r=S.history.find(x=>x.id===b.dataset.historyShare);if(r)await shareText(resultText(r));return;}if(b.dataset.delete){if(!confirm('Slet denne brænding'+(preview?' fra denne browser?':' fra familiens fælles historik?')))return;if(preview){S.history=S.history.filter(x=>x.id!==b.dataset.delete);storeLocal('history',S.history);}else{await api('/history/'+encodeURIComponent(b.dataset.delete),'DELETE',{});S.history=S.history.filter(x=>x.id!==b.dataset.delete);}render();}}catch(e){S.error=e.message;render();}});
byId('root').addEventListener('change',ev=>{const t=ev.target;if(t.id==='price-mode'){readCalc();const previous=S.mode;S.mode=t.value;S.prices=[];S.result=null;S.optimal=null;S.fetchedAt=null;if(previous==='demo'&&S.mode!=='demo'){const p=S.config.programs.find(p=>p.id===S.program);S.kwh=p.kwh??'';S.profile=clone(p.profile||[]);}if(S.mode==='demo'&&!S.kwh)S.kwh='30';render();}if(t.id==='edit-program'){S.editProgram=Number(t.value);render();}});
byId('root').addEventListener('input',ev=>{if(['calc-date','calc-time','calc-kwh','calc-minutes','manual-price','occurrence','price-date'].includes(ev.target.id)){readCalc();if(S.result||S.optimal){S.result=null;S.optimal=null;const r=document.querySelector('.result');if(r){r.className='card empty-result';r.innerHTML='<h2>Beregn igen.</h2><p class="muted small" style="margin-top:12px">Dine indtastninger er ændret. Det tidligere resultat er ikke længere aktuelt.</p>';}document.querySelectorAll('[data-candidate]').forEach(e=>e.remove());}}});
byId('root').addEventListener('submit',async ev=>{ev.preventDefault();const id=ev.target.id;S.error='';try{if(id==='calc-form')return await runCalculation();if(id==='login-form'){const password=byId('password').value;await api('/login','POST',{password});S.status=await api('/status');S.config=await api('/config');S.logged=true;setProgram(3);await refreshHistory();render();return;}if(id==='oven-form'){const c=clone(S.config);c.name=byId('oven-name').value.trim()||'Vores ovn';c.power=E.finite(byId('oven-power').value,'Effekt');if(c.power<=0||c.power>100)throw new Error('Ugyldig effekt.');for(const p of c.programs)if(p.kwh!==null||p.profile?.length)E.validateProfile(p,c.power);await saveConfig(c);render();}if(id==='program-form'){const c=clone(S.config),p=c.programs.find(p=>p.id===S.editProgram);p.minutes=E.finite(byId('program-minutes').value,'Varighed');p.kwh=byId('program-kwh').value.trim()?E.finite(byId('program-kwh').value,'kWh'):null;p.basis=byId('program-basis').value;p.profile=parseProfile(byId('program-profile').value);if(p.minutes<=0||p.minutes>2880)throw new Error('Varighed skal være 1-2880 minutter.');if(p.profile.length||p.kwh!==null){const valid=E.validateProfile(p,c.power);p.minutes=valid.minutes;p.kwh=valid.kwh;}if(p.basis==='measured-profile'&&!p.profile.length)throw new Error('En målt profil kræver tidsopdelte intervaller.');await saveConfig(c);setProgram(S.program);render();}if(id==='electricity-form'){const c=clone(S.config);c.electricity={priceArea:byId('price-area').value,supplierId:byId('supplier-id').value.trim(),productId:byId('product-id').value.trim(),label:byId('electricity-label').value.trim(),verified:byId('electricity-verified').checked};if(c.electricity.verified&&(!c.electricity.priceArea||!c.electricity.supplierId||!c.electricity.productId))throw new Error('Udfyld alle tre id-felter først.');if(!/^[A-Za-z0-9_.:-]*$/.test(c.electricity.supplierId+c.electricity.productId))throw new Error('Id-felter må kun indeholde bogstaver, tal, punktum, bindestreg, kolon og understregning.');await saveConfig(c);render();}if(id==='save-form'){if(!S.result?.complete)throw new Error('Beregningen er ikke komplet.');const record={...clone(S.result),by:byId('save-by').value.trim(),type:byId('save-type').value,note:byId('save-note').value.trim(),savedAt:new Date().toISOString()};if(preview){record.id=String(Date.now())+'-'+Math.random().toString(36).slice(2);S.history=[record,...S.history].slice(0,40);storeLocal('history',S.history);}else{const saved=await api('/history','POST',record);record.id=saved.id;S.history=[record,...S.history].slice(0,40);}S.modal=null;S.tab='history';render();window.scrollTo(0,0);toast('Brændingen er gemt.');}}catch(e){S.error=e.message;if(S.modal)toast(e.message);else render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}if(e.key==='Tab'&&S.modal){const nodes=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select,.modal a[href]')].filter(x=>!x.disabled);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
async function start(){try{if(S.config?.programs?.length!==4)S.config=defaults();setProgram(3);S.prices=[];S.result=null;S.logged=true;}catch(e){S.error=e.message;}render();}
render();start();
})();
</script></body></html>
